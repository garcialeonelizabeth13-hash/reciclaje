<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/img/favico.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ISDE - Empresa de Ingeniería Del Reciclaje</title>
    <meta
      name="description"
      content="ISDE - Empresa de Ingeniería Del Reciclaje. Empresa Estatal Socialista del Grupo Empresarial del Reciclaje. Líderes en recolección, clasificación y reciclaje industrial."
    />
    <script>
      // Prevenir restauración de scroll del navegador
      if ('scrollRestoration' in history) {
        history.scrollRestoration = 'manual'
      }
      // Forzar scroll al inicio inmediatamente
      window.addEventListener('beforeunload', function () {
        window.scrollTo(0, 0)
      })
      // Asegurar que siempre inicie en la parte superior
      window.addEventListener('load', function () {
        setTimeout(function () {
          window.scrollTo(0, 0)
        }, 0)
      })
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
